name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The mod itself only compiles against a local game install (see install.bat); CI covers the engine-free
    # logic and the release tooling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/RouletteRevival.Tests/RouletteRevival.Tests.csproj -c Release
